[package]
name = "glyx-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "glyx-tauri"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = { version = "2" }
glyx-core = { path = "../glyx-core" }
glyx-store = { path = "../glyx-store" }
glyx-daemon = { path = "../glyx-daemon" }
