[workspace]
members = [
  "crates/glyx-core",
  "crates/glyx-crypto",
  "crates/glyx-store",
  "crates/glyx-sync",
  "crates/glyx-agent",
  "crates/glyx-autofill",
  "crates/glyx-daemon",
  "crates/glyx-cli",
  "crates/glyx-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["glyx contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
blake3 = "1"
getrandom = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
fs2 = "0.4"
rpassword = "7"
proptest = "1"
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
rust-embed = "8"
mime_guess = "2"
inquire = { version = "0.7", default-features = false, features = ["crossterm"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "rand_core"] }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
