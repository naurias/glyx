[workspace]
members = [
  "crates/glyx-core",
  "crates/glyx-crypto",
  "crates/glyx-store",
  "crates/glyx-sync",
  "crates/glyx-agent",
  "crates/glyx-autofill",
  "crates/glyx-daemon",
  "crates/glyx-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["glyx contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
blake3 = "1"
getrandom = "0.2"
